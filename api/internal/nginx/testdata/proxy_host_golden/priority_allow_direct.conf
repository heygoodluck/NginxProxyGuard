    # Combine checks: block only if geo_allowed_ip=0 AND geo_block_check=Y AND not ACME challenge
    set $geo_final_block "${geo_allowed_ip}${geo_block_check}${skip_security_for_acme}";
    if ($geo_final_block = "0Y0") {
